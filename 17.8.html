<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Step Form</title>
    <link rel="stylesheet" href="17.8.css">
</head>
<body>

    <div class="container">

      
        <div class="sidebar">

            <div class="step active">
                <div class="circle">1</div>
                <div class="step-text">
                    <span>STEP 1</span>
                    <h4>YOUR INFO</h4>
                </div>
            </div>

            <div class="step">
                <div class="circle">2</div>
                <div class="step-text">
                    <span>STEP 2</span>
                    <h4>SELECT PLAN</h4>
                </div>
            </div>

            <div class="step">
                <div class="circle">3</div>
                <div class="step-text">
                    <span>STEP 3</span>
                    <h4>ADD-ONS</h4>
                </div>
            </div>

            <div class="step">
                <div class="circle">4</div>
                <div class="step-text">
                    <span>STEP 4</span>
                    <h4>SUMMARY</h4>
                </div>
            </div>

        </div>

        <div class="content">

            <div class="form">

                <h1>Personal info</h1>

                <p>
                    Please provide your name, email address, and phone number.
                </p>

                <div class="input-group">
                    <label>Name</label>
                    <input type="text" placeholder="e.g. Stephen King">
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="e.g. stephenking@lorem.com">
                </div>

                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="text" placeholder="e.g. +1 234 567 890">
                </div>

            </div>

            <div class="buttons">
                <button>Next Step</button>
            </div>

        </div>

    </div>

</body>
</html>
